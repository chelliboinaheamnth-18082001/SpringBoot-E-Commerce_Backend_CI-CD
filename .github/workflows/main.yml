name: Build And Deploy E-Commerce Application

on:
  push:
    branches:
      - E-Commerce_MainBranchCI_CD
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Run unit tests
      - name: Run Unit Tests - Cart_Order_Service
        run: mvn -f Microservices_Project/CartAndOrderService/Cart_Order_Service/pom.xml clean test
      - name: Run Unit Tests - Product_Service
        run: mvn -f Microservices_Project/ProductService/Product_Service/pom.xml clean test
      - name: Run Unit Tests - User_Service
        run: mvn -f Microservices_Project/UserService/User_Service/pom.xml clean test

      # Build JARs
      - name: Build Cart_Order_Service JAR
        run: mvn -f Microservices_Project/CartAndOrderService/Cart_Order_Service/pom.xml clean package -DskipTests
      - name: Build E-Com_ApiGateWay JAR
        run: mvn -f Microservices_Project/E-Com_ApiGateWay/pom.xml clean package -DskipTests
      - name: Build Notification-Service JAR
        run: mvn -f Microservices_Project/Notification-Service/pom.xml clean package -DskipTests
      - name: Build Product_Service JAR
        run: mvn -f Microservices_Project/ProductService/Product_Service/pom.xml clean package -DskipTests
      - name: Build SpringCloud_EurekaServer JAR
        run: mvn -f Microservices_Project/SpringCloud_EurekaServer/pom.xml clean package -DskipTests
      - name: Build SpringCloud_ConfigServer JAR
        run: mvn -f Microservices_Project/SpringCloudConfigServer/SpringCloud_ConfigServer/pom.xml clean package -DskipTests
      - name: Build User_Service JAR
        run: mvn -f Microservices_Project/UserService/User_Service/pom.xml clean package -DskipTests

      # Docker login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & push Docker images
      - name: Build & Push Cart_Order_Service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cart-order-service:latest Microservices_Project/CartAndOrderService/Cart_Order_Service && docker push ${{ secrets.DOCKER_USERNAME }}/cart-order-service:latest

      - name: Build & Push ApiGateway
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest Microservices_Project/E-Com_ApiGateWay && docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

      - name: Build & Push Notification-Service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/notification-service:latest Microservices_Project/Notification-Service && docker push ${{ secrets.DOCKER_USERNAME }}/notification-service:latest

      - name: Build & Push Product_Service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest Microservices_Project/ProductService/Product_Service && docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest

      - name: Build & Push Eureka
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest Microservices_Project/SpringCloud_EurekaServer && docker push ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest

      - name: Build & Push ConfigServer
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/config-server:latest Microservices_Project/SpringCloudConfigServer/SpringCloud_ConfigServer && docker push ${{ secrets.DOCKER_USERNAME }}/config-server:latest

      - name: Build & Push User_Service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest Microservices_Project/UserService/User_Service && docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest
