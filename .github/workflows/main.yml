name: Build And Deploy E-Commerce Application

on:
  push:
    branches:
      - E-Commerce_MainBranchCI_CD
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Run unit tests with JaCoCo coverage
      - name: Run Unit Tests - Cart_Order_Service
        run: mvn -f Microservices_Project/CartAndOrderService/Cart_Order_Service/pom.xml clean test jacoco:report
      - name: Upload Cart_Order_Service Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cart-order-service
          path: Microservices_Project/CartAndOrderService/Cart_Order_Service/target/site/jacoco/

      - name: Run Unit Tests - Product_Service
        run: mvn -f Microservices_Project/ProductService/Product_Service/pom.xml clean test jacoco:report
      - name: Upload Product_Service Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-product-service
          path: Microservices_Project/ProductService/Product_Service/target/site/jacoco/

      - name: Run Unit Tests - User_Service
        run: mvn -f Microservices_Project/UserService/User_Service/pom.xml clean test jacoco:report
      - name: Upload User_Service Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-user-service
          path: Microservices_Project/UserService/User_Service/target/site/jacoco/

      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Add this secret in GitHub settings
          files: |
            Microservices_Project/CartAndOrderService/Cart_Order_Service/target/site/jacoco/jacoco.xml
            Microservices_Project/ProductService/Product_Service/target/site/jacoco/jacoco.xml
            Microservices_Project/UserService/User_Service/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true

      # SonarQube/SonarCloud analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=chelliboinaheamnth-18082001_SpringBoot-E-Commerce_Backend_CI-CD
            -Dsonar.organization=chelliboinaheamnth-18082001
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}



      # Build JARs for all services
      - name: Build Cart_Order_Service JAR
        run: mvn -f Microservices_Project/CartAndOrderService/Cart_Order_Service/pom.xml clean package -DskipTests
      - name: Build E-Com_ApiGateWay JAR
        run: mvn -f Microservices_Project/E-Com_ApiGateWay/pom.xml clean package -DskipTests
      - name: Build Notification-Service JAR
        run: mvn -f Microservices_Project/Notification-Service/pom.xml clean package -DskipTests
      - name: Build Product_Service JAR
        run: mvn -f Microservices_Project/ProductService/Product_Service/pom.xml clean package -DskipTests
      - name: Build SpringCloud_EurekaServer JAR
        run: mvn -f Microservices_Project/SpringCloud_EurekaServer/pom.xml clean package -DskipTests
      - name: Build SpringCloud_ConfigServer JAR
        run: mvn -f Microservices_Project/SpringCloudConfigServer/SpringCloud_ConfigServer/pom.xml clean package -DskipTests
      - name: Build User_Service JAR
        run: mvn -f Microservices_Project/UserService/User_Service/pom.xml clean package -DskipTests

      # Docker login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & push Docker images with latest and commit SHA tags
      - name: Build & Push Cart_Order_Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cart-order-service:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/cart-order-service:${{ github.sha }} \
                       Microservices_Project/CartAndOrderService/Cart_Order_Service
          docker push ${{ secrets.DOCKER_USERNAME }}/cart-order-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cart-order-service:${{ github.sha }}

      - name: Build & Push ApiGateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.sha }} \
                       Microservices_Project/E-Com_ApiGateWay
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.sha }}

      - name: Build & Push Notification-Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/notification-service:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/notification-service:${{ github.sha }} \
                       Microservices_Project/Notification-Service
          docker push ${{ secrets.DOCKER_USERNAME }}/notification-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/notification-service:${{ github.sha }}

      - name: Build & Push Product_Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/product-service:${{ github.sha }} \
                       Microservices_Project/ProductService/Product_Service
          docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/product-service:${{ github.sha }}

      - name: Build & Push Eureka
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/eureka-server:${{ github.sha }} \
                       Microservices_Project/SpringCloud_EurekaServer
          docker push ${{ secrets.DOCKER_USERNAME }}/eureka-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/eureka-server:${{ github.sha }}

      - name: Build & Push ConfigServer
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/config-server:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/config-server:${{ github.sha }} \
                       Microservices_Project/SpringCloudConfigServer/SpringCloud_ConfigServer
          docker push ${{ secrets.DOCKER_USERNAME }}/config-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/config-server:${{ github.sha }}

      - name: Build & Push User_Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.sha }} \
                       Microservices_Project/UserService/User_Service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.sha }}
