name: Build And Deploy E-Commerce Application

on:
  push:
    branches:
      - E-Commerce_MainBranchCI_CD

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Run unit tests only for Cart_Order_Service, Product_Service, User_Service
      - name: Run Unit Tests - Cart_Order_Service
        run: mvn -f CartAndOrderService/Cart_Order_Service/pom.xml clean test

      - name: Run Unit Tests - Product_Service
        run: mvn -f ProductService/Product_Service/pom.xml clean test

      - name: Run Unit Tests - User_Service
        run: mvn -f UserService/User_Service/pom.xml clean test

      # Build JARs for all services
      - name: Build Cart_Order_Service JAR
        run: mvn -f CartAndOrderService/Cart_Order_Service/pom.xml clean package -DskipTests

      - name: Build E-Com_ApiGateWay JAR
        run: mvn -f E-Com_ApiGateWay/pom.xml clean package -DskipTests

      - name: Build Notification-Service JAR
        run: mvn -f Notification-Service/pom.xml clean package -DskipTests

      - name: Build Product_Service JAR
        run: mvn -f ProductService/Product_Service/pom.xml clean package -DskipTests

      - name: Build SpringCloud_EurekaServer JAR
        run: mvn -f SpringCloud_EurekaServer/pom.xml clean package -DskipTests

      - name: Build SpringCloud_ConfigServer JAR
        run: mvn -f SpringCloudConfigServer/SpringCloud_ConfigServer/pom.xml clean package -DskipTests

      - name: Build User_Service JAR
        run: mvn -f UserService/User_Service/pom.xml clean package -DskipTests
